<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="icon" href="./img/coruja.1.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/custom.css">
</head>

<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-card" style="max-width: 440px;">
      <h3 class="text-center">Criar Conta</h3>

      <form id="registerForm">
        <div class="mb-3 text-center">
          <label for="fotoPerfil" class="form-label d-block">Foto de perfil</label>
          <input type="file" class="form-control" id="fotoPerfil" accept="image/*">
          <img id="fotoPreview" src="./img/coruja.1.png" alt="Preview da foto" class="rounded-circle mt-3 border" width="80" height="80" style="object-fit: cover; background: #f3f3f3;">
        </div>

        <div class="mb-3">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" placeholder="********" required>
        </div>

        <div class="mb-3">
          <label for="confirmaSenha" class="form-label">Confirmar senha</label>
          <input type="password" class="form-control" id="confirmaSenha" placeholder="********" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="termos" required>
          <label class="form-check-label" for="termos">
            Aceito os <a href="#">termos de uso</a>
          </label>
        </div>

        <button type="submit" class="btn btn-success w-100">Cadastrar</button>
      </form>

      <div class="text-center mt-3">
        <p class="mb-0">Já tem conta? <a href="./login.html">Entrar</a></p>
      </div>
      <div class="text-center mt-3">
        <p class="mb-0"><a href="./index.html">Voltar para início</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="./banco/cadastro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
